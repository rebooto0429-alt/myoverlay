<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>透明スクロールテロップ</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent !important;
  }
  .ticker {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    overflow: hidden;
    white-space: nowrap;
    background: transparent;
    padding: 12px 0;
    box-sizing: border-box;
  }
  .track {
    display: flex;
    width: max-content;
    animation: scroll-left 24s linear infinite;
  }
  .message {
    flex: none;
    padding-right: 100px;
    color: #e8c77c;
    font-family: "Yu Gothic", "Meiryo", sans-serif;
    font-size: 48px;
    font-weight: 700;
    line-height: 1.25;
    text-shadow: 0 2px 5px rgba(0,0,0,.9), 0 0 10px rgba(232,199,124,.35);
  }
  @keyframes scroll-left {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }
</style>
</head>
<body>
<div class="ticker">
  <div class="track">
    <div class="message">🍸 いらっしゃいませ！初見さん大歓迎！お気軽にコメントしてください♪ 乾杯しましょう！フォローもお待ちしています！ 🍸</div>
    <div class="message" aria-hidden="true">🍸 いらっしゃいませ！初見さん大歓迎！お気軽にコメントしてください♪ 乾杯しましょう！フォローもお待ちしています！ 🍸</div>
  </div>
</div>
</body>
</html>
